# MINIMAL (Small API, single mode):
# ---------------------------------
# name: "My API"
# spec: "./openapi.json"
# base_url: "https://api.example.com"
# auth:
#   type: bearer
#   token: "${API_TOKEN}"
#
#
# MODULAR (Large API with hub):
# -----------------------------
# name: "Large API"
# spec: "./openapi.json"
# base_url: "https://api.example.com"
# mode: modular
# auth:
#   type: bearer
#   token: "${API_TOKEN}"
# llm:
#   enabled: true
#   provider: gemini
#   model: gemini-2.0-flash
#   api_key: "${GEMINI_API_KEY}"
# modules:
#   enabled: true
#   split_strategy: llm
# hub:
#   enabled: true
#   port: 9000
#
#
# MULTI-TENANT (Dynamic JWT auth):
# --------------------------------
# name: "Multi-Tenant API"
# spec: "./openapi.json"
# base_url: "https://api.example.com"
# auth:
#   type: jwt
#   validation:
#     enabled: true
#     jwks_url: "https://auth.example.com/.well-known/jwks.json"
#     issuer: "https://auth.example.com"
#     audience: "my-api"
#
# =============================================================================
